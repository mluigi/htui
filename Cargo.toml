[workspace]
members  = ["crates/htui-core", "crates/htui", "crates/htui-store", "crates/htui-agent"]
resolver = "3"

[workspace.package]
edition      = "2024"
rust-version = "1.98"          # MSRV = the exact toolchain pin (T7/X9); see README "Toolchain"
license      = "MIT"
publish      = false

[workspace.dependencies]
htui-core          = { path = "crates/htui-core" }
htui-store         = { path = "crates/htui-store" }
htui-agent         = { path = "crates/htui-agent" }
uuid               = { version = "1.26", features = ["v7", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "2"
tokio              = { version = "1.53", features = ["rt-multi-thread", "sync", "macros", "time",
                       "process", "io-util", "fs"] }
ratatui            = "0.30.2"
crossterm          = { version = "0.29", features = ["event-stream"] }
futures            = "0.3"     # StreamExt for crossterm::event::EventStream (V4)
clap               = { version = "4", features = ["derive", "env"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow             = "1"
insta              = "1.48"
sqlx               = { version = "0.9.0", default-features = false, features = [
                       "runtime-tokio", "postgres", "sqlite", "migrate", "macros",
                       "chrono", "uuid", "json", "tls-rustls-ring-native-roots"] }
keyring            = { version = "3.6.3", default-features = false, features = [
                       "windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
dirs               = "6"
gethostname        = "1.1"
sha2               = "0.10"
toml               = "1.1"
# MOD-2 milestone 2 (ANA-4 §4.2, §8). The SDK version is exact-pinned: the protocol is the
# contract, and a patch bump to it is a wire change until proven otherwise.
agent-client-protocol = "=2.1.0"
tokio-util            = { version = "0.7.19", features = ["compat"] }
process-wrap          = { version = "10.0.0", features = ["tokio1", "creation-flags",
                          "job-object", "process-group"] }
# Windows only, and only to name `CREATE_NO_WINDOW`: `process-wrap`'s `CreationFlags` wraps the
# `windows` crate's `PROCESS_CREATION_FLAGS` and exposes no constructor of its own. Same version as
# `process-wrap`'s own dependency, so the tree holds one copy.
windows               = { version = "0.62.2", features = ["Win32_System_Threading"] }
similar               = "3.2.0"   # milestone 3 diff synthesis; no crate consumes it yet (A3)
which                 = "8.0.6"
# MOD-2 milestone 5 (plan D47): the probe compiles `VersionProbe.pattern` and compares a captured
# version with `VersionProbe.min`. Both were already in the graph as transitive dependencies
# (`regex 1.13.1`, `semver 1.0.28`), so declaring them adds no compiled crate.
regex                 = "1.13"
semver                = "1.0"
# MOD-20 (plan D9): the installer's HTTP client. `default-features = false` is load-bearing
# (`default` = default-tls + charset + http2 + system-proxy). `rustls-no-provider` keeps ring —
# sqlx's provider — the only one in the process; `install/http.rs` installs it explicitly, because
# reqwest does **not** infer the single enabled provider and `Client::build` panics without one.
reqwest               = { version = "0.13", default-features = false, features = [
                          "rustls-no-provider", "stream", "system-proxy"] }
rustls                = { version = "0.23", default-features = false, features = [
                          "ring", "std", "tls12", "logging"] }
# MOD-20 T5 (blueprint B.4): naming the chunk type a body arrives in needs the crate that owns it
# — `reqwest 0.13.5` re-exports `Bytes` nowhere. Already in the lock as reqwest's own dependency,
# so this declaration adds a name and not a crate. The alternative, a `Vec<u8>` per chunk, copies
# every chunk of a 682 MB body.
bytes                 = "1"
# MOD-20 (plan D10): deflate-only zip, plain tar, pure-Rust gzip. The default feature sets buy
# four decompressors and an AES stack nobody has an archive for; `tar`'s default `xattr` is a
# unix-only extra with no use here.
zip                   = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
tar                   = { version = "0.4", default-features = false }
flate2                = "1.1"
# MOD-20 (plan D11): free space without `unsafe` — `rustix` on unix, `windows-sys` on Windows,
# both already in the lock.
fs4                   = { version = "1.1", default-features = false, features = ["sync"] }

[workspace.lints.rust]
unsafe_code                   = "forbid"
missing_debug_implementations = "warn"
unused_qualifications         = "warn"

[workspace.lints.rustdoc]
# Named lints, not the `rustdoc::all` group: a future rustc adding one cannot break the build
# (blueprint A.4 reason 2). Inert outside `cargo doc`, so the TDD loop is untouched.
broken_intra_doc_links   = "deny"
private_intra_doc_links  = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# clippy::pedantic is deliberately NOT enabled.
