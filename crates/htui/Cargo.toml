[package]
name        = "htui"
version     = "0.1.0"
description = "Terminal UI for htui: tabs, overlays, keymap and the store worker seam"

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lib]
name = "htui"
path = "src/lib.rs"

[[bin]]
name = "htui"
path = "src/main.rs"

[features]
default = []
# Compiles `testkit::Harness` into the library so integration tests under `tests/` (T4, T5) can
# build an `App`, feed keys and render to a `TestBackend`. MOD-64 D230: and htui-store's
# `test-support`, so `concepts_worker::MemIndex` (over `MemVectorStore`) compiles whenever `testkit`
# does.
testkit = ["htui-store/test-support"]

[dependencies]
htui-agent         = { workspace = true }
# MOD-4 milestone 6 (plan D153): `run_worker` drives the orchestrator from the store worker loop.
htui-orch          = { workspace = true }
# MOD-41 plan D6: the run runtime, shared with `htui worker`; `run_worker` is its TUI adapter.
htui-worker        = { workspace = true }
# MOD-11 D6: `htui mcp`, the stdio relay an agent starts as its htui MCP server.
htui-mcp           = { workspace = true }
htui-core          = { workspace = true, features = ["demo"] }
# MOD-10 D15: `secrets::KeyringInfisical` builds the process's one `InfisicalProvider` from the
# keyring's URL and identity. A workspace member already in the lock; nothing new is compiled.
htui-secrets       = { workspace = true }
chrono             = { workspace = true }
serde_json         = { workspace = true }
# MOD-66 review N5: `AgentLaunch::deserialize(&launch)` reads a stored launch without cloning the
# document. Already in htui's graph through every workspace crate, so nothing new is compiled.
serde              = { workspace = true }
htui-store         = { workspace = true, features = ["demo", "local-embed"] }
anyhow             = { workspace = true }
clap               = { workspace = true }
crossterm          = { workspace = true }
futures            = { workspace = true }
ratatui            = { workspace = true }
# MOD-57 M1 (plan P10): the in-pane editor's PTY and VT parser.
portable-pty       = { workspace = true }
vt100              = { workspace = true }
# MOD-9: `signal` holds Ctrl-C and Ctrl-\ off htui while `$EDITOR` has the cooked tty (editor.rs).
# MOD-11 blueprint H-15: `io-std`, the stdio `htui mcp` splices; named here rather than left to
# feature unification through `htui-mcp`.
tokio              = { workspace = true, features = ["signal", "io-std"] }
# MOD-20 D18: `CancellationToken` is how an install is stopped. Cooperative, because the task has
# to sweep its staging entry and send its own last frame — neither of which an `abort()` allows.
tokio-util         = { workspace = true }
tracing            = { workspace = true }
# MOD-4 milestone 6 (plan D156): the run runtime's lease owner, one `Uuid::now_v7()` per process.
uuid               = { workspace = true }
tracing-subscriber = { workspace = true }
# MOD-15 M6 D3: the masked field's buffer and the DSN on its way to the newtype are wiped.
zeroize            = { workspace = true }
sentry = { workspace = true }
sentry-anyhow = { workspace = true }
sentry-tracing = { workspace = true }
# MOD-9 D9: the $EDITOR temp file (removed on drop); already in the lock (was dev-only). The store
# worker's swap tests also open a throwaway `cache.sqlite` with it, never the user's.
tempfile = "3"
# MOD-9 D12: the Templates view's line diff; 3.2.0 is already compiled for htui-agent.
similar            = { workspace = true }

# MOD-54 D1: display-cell width and grapheme boundaries for the text widgets.
unicode-width         = { workspace = true }
unicode-segmentation   = { workspace = true }
# MOD-23 D236: the agent form's args field.
shell-words            = { workspace = true }
# MOD-45 D293: the payload's hash, compared with the remote binary's. 0.10.9 is already in htui's
# graph (via htui-store), so nothing new is compiled.
sha2                   = { workspace = true }
# MOD-28 D4: the flow view of the Runs pane (`runs/execution_graph.rs`).
rataflow               = { workspace = true }

[target.'cfg(unix)'.dependencies]
# MOD-57 M1 (pane.rs kill path): SIGHUP then SIGKILL to the in-pane editor's process group, and a
# non-reaping `waitid`, without `unsafe`. 1.1.4 with `process` is already in htui's graph (via
# cap-std and fs4), so nothing new is compiled.
rustix                 = { workspace = true }

[dev-dependencies]
# The chat tab's snapshots drive the fake transport through the same registry the ACP one uses.
htui-agent = { workspace = true, features = ["test-support"] }
# `run_worker`'s walk tests: `FakeIsolator`, `FakeVerifier`, and `htui-core/test-support`'s
# `MemFault` for the store-outage case (MOD-4 plan D175).
htui-orch  = { workspace = true, features = ["test-support"] }
# MOD-41 plan D8: `htui_worker::testing`, the white-box surface `run_worker`'s tests reach the
# runtime's private state through.
htui-worker = { workspace = true, features = ["test-support"] }
# `testkit::seed_mirror` and the throwaway-database harness: MOD-2 §11 criterion 12 is the one test
# that needs a driver and a server at once, and this crate is the only one that can hold both.
htui-store = { workspace = true, features = ["demo", "test-support"] }
# `filters` so a chat snapshot can substitute the session id the transport mints per run.
insta    = { workspace = true, features = ["filters"] }
# T43 reads `run_step.usage` and the two `agent_box` quota columns with a raw `SELECT` over
# `testkit::TestDb::pool`: no `ReadStore` method returns either (`pg_criteria.rs:93-105` says why),
# and the point of that suite is what Postgres actually holds. Runtime-checked queries only, so
# `.sqlx/` stays a `htui-store` concern.
sqlx     = { workspace = true }
# `net` for the loopback fixture servers the MOD-20 install cases answer from (blueprint P-5).
tokio    = { workspace = true, features = ["test-util", "net"] }

[lints]
workspace = true
