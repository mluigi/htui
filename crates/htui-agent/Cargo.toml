[package]
name        = "htui-agent"
version     = "0.1.0"
description = "Agent driver seam, event model and recorder for htui"

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true

[features]
default = []
# Fakes and the transport-neutral conformance suite (plan MOD-2 D1); forwards to htui-core so a
# case can build its assertions over `MemStore::demo()`.
test-support = ["htui-core/test-support"]

[dependencies]
htui-core  = { workspace = true }
chrono     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
sha2       = { workspace = true }
tokio      = { workspace = true, features = ["sync", "rt", "time", "process", "io-util", "fs"] }
tracing    = { workspace = true }
# Milestone 2 (T7): the ACP config type the launch row builds, the process supervisor that owns
# the child, `AsyncRead`/`AsyncWrite` -> `futures` adapters for the SDK's byte streams, and the
# PATH/PATHEXT-aware command lookup.
agent-client-protocol = { workspace = true }
process-wrap          = { workspace = true }
tokio-util            = { workspace = true }
which                 = { workspace = true }
# Milestone 3 (T11): `edit_proposal.diff` is a unified diff synthesized from the old/new full text
# ACP carries (`docs/ANA-4.md` §4.3); this is the first consumer of the workspace declaration.
similar               = { workspace = true }
# Milestone 5 (T24): the probe's version tier compiles `VersionProbe.pattern` (`regex`) and
# compares the capture with `VersionProbe.min` (`semver`), and its glob walker expands a leading
# `~` through `dirs::home_dir` (plan D47, D48).
regex                 = { workspace = true }
semver                = { workspace = true }
dirs                  = { workspace = true }
# MOD-20 T4 (plan D9): the installer's registry read and archive `HEAD`. `install/http.rs` is the
# only file that names `reqwest`; `rustls` is direct only so the explicit provider install has a
# name to say (fact-check amendment to D9).
reqwest               = { workspace = true }
rustls                = { workspace = true }
# MOD-20 T5 (plan D10, D11): the archive shapes the registry publishes, and free space. `bytes`
# names the chunk type `install/http.rs` hands the fetch; `install/archive.rs` is the only file
# that names `zip`, `tar` or `flate2`.
bytes                 = { workspace = true }
zip                   = { workspace = true }
tar                   = { workspace = true }
flate2                = { workspace = true }
fs4                   = { workspace = true }
# MOD-2 milestone 8 (T50, plan D84): the CLI supervisor mints its own session id and passes it as
# `claude --session-id`, so a later step can `--resume` it. `Uuid::now_v7()`, the same call
# `htui_core::model::ids` makes; the workspace pins `v7` + `serde` and this crate needs no other
# feature.
uuid                  = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
# `net` (MOD-20 T4): `tests/install.rs` serves the registry and the archive `HEAD` from a
# hand-rolled `TcpListener` responder, so every install case runs offline.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util", "net"] }
# The tool resolver's `NodePackage` tier is tested against a `node_modules` tree in a throwaway
# directory, never the developer's own (T11 step 2).
tempfile = "3"
# Recorded transcripts are pinned as snapshots, so adapter drift shows up as a reviewable diff
# rather than as a decode that quietly lands in `other` (ANA-4 §8 test strategy 3).
insta = { workspace = true }

[lints]
workspace = true
