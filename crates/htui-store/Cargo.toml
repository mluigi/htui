[package]
name        = "htui-store"
version     = "0.1.0"
description = "Postgres store, per-box SQLite cache and the Backend the TUI holds"

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true

[features]
default = []
# Forwards to htui-core so `PgStore::load_demo(&DemoData)` and `fixtures::ids` exist.
demo    = ["htui-core/demo"]
# Compiles `testkit` into the library: the throwaway-database harness and the mirror seeder. It
# lives here rather than under `tests/` because MOD-2 milestone 4's criterion-12 case needs a
# driver *and* a throwaway database in one test, and only the `htui` crate can hold both.
test-support = ["demo"]
# MOD-34 D2: the production embedder (`embed::FastEmbedder`). Off by default because `ort`
# downloads onnxruntime at build time; the `htui` binary turns it on. Offline builds can point
# `ORT_LIB_LOCATION` at a local onnxruntime 1.18 instead.
local-embed = ["dep:fastembed", "dep:rustls"]

[dependencies]
htui-core   = { workspace = true, features = ["sqlx"] }
sqlx        = { workspace = true }
keyring     = { workspace = true }
zeroize     = { workspace = true }
dirs        = { workspace = true }
gethostname = { workspace = true }
sha2        = { workspace = true }
toml        = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
qdrant-client      = { workspace = true }
fastembed          = { workspace = true, optional = true }
# `FastEmbedder::new` installs ring as the process provider before hf-hub downloads the model.
rustls             = { workspace = true, optional = true }

[dev-dependencies]
htui-core = { workspace = true, features = ["test-support"] }
htui-store = { workspace = true, features = ["test-support"] }
tokio     = { workspace = true, features = ["test-util", "rt-multi-thread"] }
tempfile  = "3"
futures   = { workspace = true }
rustls    = { workspace = true }

[lints]
workspace = true
