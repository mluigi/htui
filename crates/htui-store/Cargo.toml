[package]
name        = "htui-store"
version     = "0.1.0"
description = "Postgres store, per-box SQLite cache and the Backend the TUI holds"

edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true

[features]
default = []
# Forwards to htui-core so `PgStore::load_demo(&DemoData)` and `fixtures::ids` exist.
demo    = ["htui-core/demo"]
# Compiles `testkit` into the library: the throwaway-database harness and the mirror seeder. It
# lives here rather than under `tests/` because MOD-2 milestone 4's criterion-12 case needs a
# driver *and* a throwaway database in one test, and only the `htui` crate can hold both.
test-support = ["demo"]
# MOD-68: the production embedder (`embed::RtenEmbedder`) and its first-use model fetch (`model`).
# Off by default so the store's own tests build without it; the `htui` binary turns it on. Nothing
# is downloaded at build time.
local-embed = ["dep:rten", "dep:rten-tensor", "dep:tokenizers", "dep:reqwest", "dep:rustls"]

[dependencies]
htui-core   = { workspace = true, features = ["sqlx"] }
sqlx        = { workspace = true }
keyring     = { workspace = true }
zeroize     = { workspace = true }
dirs        = { workspace = true }
gethostname = { workspace = true }
sha2        = { workspace = true }
# MOD-7 D1: the box fingerprint, HMAC-SHA256 keyed by the OS machine identity.
hmac        = { workspace = true }
toml        = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
# MOD-40 plan D9: the target version is compared as semver.
semver      = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
qdrant-client      = { workspace = true }
# MOD-68: `RtenEmbedder` (ANA-23 §7.1).
rten               = { workspace = true, optional = true }
rten-tensor        = { workspace = true, optional = true }
tokenizers         = { workspace = true, optional = true }
# MOD-68 D6: the pinned model fetch (`model::ensure_model`). Both are already in the graph through
# `qdrant-client`; `rustls` is named to install `ring` as the provider, as `htui-agent` does.
reqwest            = { workspace = true, optional = true }
rustls             = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# MOD-7 D1: the fingerprint's Windows machine identity, `HKLM\SOFTWARE\Microsoft\Cryptography`
# `MachineGuid`.
windows-registry   = { workspace = true }

[dev-dependencies]
htui-core = { workspace = true, features = ["test-support"] }
htui-store = { workspace = true, features = ["test-support"] }
tokio     = { workspace = true, features = ["test-util", "rt-multi-thread"] }
tempfile  = "3"
futures   = { workspace = true }
rustls    = { workspace = true }

[lints]
workspace = true
