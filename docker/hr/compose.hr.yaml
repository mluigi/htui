# One /handoff-run sandbox (TOOL-7). Instantiated only by scripts/hr:
#   docker compose -p hr-<item> -f docker/hr/compose.hr.yaml up -d --wait
# Every host path and per-run value comes from the environment scripts/hr exports; `:?` fails the
# parse rather than mount the wrong thing. No `ports:` anywhere: all three services share postgres's
# network namespace, so localhost:5439/6333/6334 inside mean what they mean on the host and nothing
# collides with htui-postgres/htui-qdrant or another run. Deliberately NOT mounted (D7):
# ~/.gitconfig, ~/.git-credentials, ~/.ssh.
# Design: .claude/plans/tool-7-hr-sandbox.plan.md; env contract: .claude/plans/tool-7-hr-sandbox.blueprint.md §T1.
services:
  init:            # one-shot: named-volume roots, and mount points Docker makes, are created root-owned
    image: ${HR_IMAGE:-htui-hr-dev}
    user: "0:0"
    network_mode: none
    command: ["chown", "${HR_UID:?}:${HR_GID:?}", "${HR_HOME:?}/.gortex", "${HR_HOME:?}/.cargo",
              "${HR_HOME:?}/.cargo/registry", "${HR_HOME:?}/.cargo/registry/src"]
    volumes:
      - {type: volume, source: gortex,    target: "${HR_HOME:?}/.gortex"}
      - {type: volume, source: cargo,     target: "${HR_HOME:?}/.cargo"}
      - {type: volume, source: cargo-src, target: "${HR_HOME:?}/.cargo/registry/src"}

  postgres:
    image: postgres:16
    command: ["postgres", "-p", "5439", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    shm_size: 1gb
    volumes:
      - {type: volume, source: pgdata, target: /var/lib/postgresql/data}
    healthcheck:   # -h localhost: the entrypoint's init-time temp server is socket-only, so this goes green only on the real server
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5439 -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.1
    network_mode: service:postgres
    depends_on: [postgres]
    volumes:
      - {type: volume, source: qdrant, target: /qdrant/storage}

  dev:
    image: ${HR_IMAGE:-htui-hr-dev}
    network_mode: service:postgres
    init: true                      # reap claude/cargo children; sleep is PID 1 otherwise
    cpus: ${HR_CPUS:-4}
    working_dir: ${HR_HOST_REPO:?}
    depends_on:
      postgres: {condition: service_healthy}
      qdrant:   {condition: service_started}
      init:     {condition: service_completed_successfully}
    # $$ = literal $ (compose would interpolate $HOME from the host otherwise). The Gortex daemon's
    # runtime files live in the per-run volume and outlive the container: after a restart a stale
    # daemon.pid can name a live, unrelated PID, and `gortex mcp` then refuses to spawn ("daemon
    # already running"). Nothing can be running at container start, so clear them (TOOL-7 T2).
    command: ["bash", "-c", "rm -f \"$$HOME\"/.gortex/cache/daemon.pid \"$$HOME\"/.gortex/cache/daemon.sock \"$$HOME\"/.gortex/cache/daemon.spawn.lock \"$$HOME\"/.gortex/cache/daemon.spawn.fail; test -e \"$$HOME/.claude.json\" || cp /hr-seed/claude.json \"$$HOME/.claude.json\"; exec sleep infinity"]
    environment:
      USERNAME: htui-ci
      HTUI_TEST_DATABASE_URL: postgres://postgres@localhost:5439/postgres
      HTUI_TEST_QDRANT_URL: http://localhost:6334
      HR_ITEM: ${HR_ITEM:?}
      HR_SANDBOX: "1"
      HR_STATE: /hr-state
      # ~/.local/share/uv/tools is read-only, and uvx (serena's MCP entry) writes temp files into its
      # tool dir even for ephemeral tools; a per-container tool dir keeps the host's uv tools untouched (TOOL-7 T2).
      UV_TOOL_DIR: /tmp/uv-tools
      # `cargo install` lands per container, never in the shared cargo volume (review M5); its bin
      # dir is last on PATH, so nothing a run installs can put a new command ahead of the toolchain.
      CARGO_INSTALL_ROOT: /tmp/cargo-install
      GIT_AUTHOR_NAME: ${HR_GIT_NAME:?}
      GIT_AUTHOR_EMAIL: ${HR_GIT_EMAIL:?}
      GIT_COMMITTER_NAME: ${HR_GIT_NAME:?}
      GIT_COMMITTER_EMAIL: ${HR_GIT_EMAIL:?}
      # mise dirs first: ~/.local/bin holds a stale uv/uvx that would shadow mise's. No
      # ~/.cargo/bin: that dir is in the shared cargo volume (review M5). Leaving it off PATH is not
      # enough - cargo searches $CARGO_HOME/bin for subcommands ahead of PATH - so it is also an
      # empty read-only tmpfs below (re-review M-A).
      PATH: ${HR_MISE_PATH:?}:/opt/rust/cargo/bin:${HR_HOME:?}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/tmp/cargo-install/bin
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-truecolor}
    volumes:
      - {type: bind, source: "${HR_SRC:?}",                  target: "${HR_HOST_REPO:?}",                   bind: {create_host_path: false}}
      - {type: bind, source: "${HR_HOST_REPO:?}",            target: /host/htui, read_only: true,           bind: {create_host_path: false}}
      - {type: bind, source: "${HR_HOST_REPO:?}/.remember",  target: "${HR_HOST_REPO:?}/.remember",         bind: {create_host_path: false}}
      - {type: bind, source: "${HR_STATE_HOST:?}",           target: /hr-state,                             bind: {create_host_path: false}}
      - {type: bind, source: "${HR_CLAUDE_JSON:?}",          target: /hr-seed/claude.json, read_only: true, bind: {create_host_path: false}}
      # The host's clock zone: the image has no tzdata, so TZ= alone would fall back to UTC. Docker
      # follows the /etc/localtime symlink, so the container gets the zone file itself.
      # /etc/timezone is not mounted: Ubuntu 26.04 no longer ships it, and a missing bind source fails `up`.
      - {type: bind, source: /etc/localtime, target: /etc/localtime, read_only: true, bind: {create_host_path: false}}
      # Only the tool dirs of ~/.local, read-only (review C1): the rest of it holds secrets (nvim undo
      # histories of credential files, keyrings, uv/gh credentials). claude = mise installs; gortex,
      # uv/uvx (stale, shadowed) = ~/.local/bin; python3 -> uv/python; graphify, headroom -> uv/tools
      # venvs whose interpreter is uv/python. Parents are pre-created user-owned in the image (F13).
      - {type: bind, source: "${HR_HOME:?}/.local/bin",                  target: "${HR_HOME:?}/.local/bin",                  read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${HR_HOME:?}/.local/share/mise/installs",  target: "${HR_HOME:?}/.local/share/mise/installs",  read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${HR_HOME:?}/.local/share/uv/python",      target: "${HR_HOME:?}/.local/share/uv/python",      read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${HR_HOME:?}/.local/share/uv/tools",       target: "${HR_HOME:?}/.local/share/uv/tools",       read_only: true, bind: {create_host_path: false}}
      # ~/.claude stays read-write and shared: login (.credentials.json), settings, plugins, skills,
      # agents, commands. What in it belongs to every other project, or to the host's own sessions,
      # is masked per run (re-review M-C): an empty tmpfs over each such directory, a per-run empty
      # file (HR_CLAUDE_MASK, in the run dir) over each such file. Then the one project the run works
      # in, ~/.claude/projects/<HR_CLAUDE_PROJECT> (Claude's name for HR_HOST_REPO), comes back
      # read-write over the projects tmpfs: its auto-memory and sessions are shared with the host.
      # scripts/hr creates every mount point on the host first, owned by the user. Docker mounts
      # parents before children whatever the order; the list keeps that order anyway.
      # Every tmpfs has a size: the default is half of the host's RAM, each. They are RAM while
      # used and die with the container. projects 256m: the run's own project is bound over it and
      # does not count, but Claude files the transcripts of sessions started elsewhere (subagents
      # in the run's linked worktrees, a cwd of /tmp) there, and those reach tens of MB.
      # file-history 128m: pre-edit copies of every file the run's sessions edit (the host holds
      # ~25 MB across all of its sessions, at most ~3 MB for one). paste-cache 64m: pasted images.
      # The rest 16m: small per-session state (the host's copies are a few MB at most).
      - {type: bind, source: "${HR_HOME:?}/.claude",         target: "${HR_HOME:?}/.claude",                bind: {create_host_path: false}}
      - {type: tmpfs, target: "${HR_HOME:?}/.claude/projects", tmpfs: {mode: 0o1777, size: 256m}}        # every project's transcripts and memory
      - {type: bind, source: "${HR_HOME:?}/.claude/projects/${HR_CLAUDE_PROJECT:?}", target: "${HR_HOME:?}/.claude/projects/${HR_CLAUDE_PROJECT:?}", bind: {create_host_path: false}}
      - {type: tmpfs, target: "${HR_HOME:?}/.claude/file-history", tmpfs: {mode: 0o1777, size: 128m}}    # pre-edit copies of files, every project
      - {type: tmpfs, target: "${HR_HOME:?}/.claude/paste-cache", tmpfs: {mode: 0o1777, size: 64m}}      # pasted text and images
      - {type: tmpfs, target: "${HR_HOME:?}/.claude/shell-snapshots", tmpfs: {mode: 0o1777, size: 16m}}  # the host shell's functions, aliases, env
      - {type: tmpfs, target: "${HR_HOME:?}/.claude/session-env", tmpfs: {mode: 0o1777, size: 16m}}      # per-session environment
      - {type: tmpfs, target: "${HR_HOME:?}/.claude/session-data", tmpfs: {mode: 0o1777, size: 16m}}     # per-session summaries (a plugin)
      - {type: tmpfs, target: "${HR_HOME:?}/.claude/sessions", tmpfs: {mode: 0o1777, size: 16m}}         # the host's live sessions and their keys
      - {type: tmpfs, target: "${HR_HOME:?}/.claude/daemon", tmpfs: {mode: 0o1777, size: 16m}}           # the host Claude daemon's control key
      - {type: tmpfs, target: "${HR_HOME:?}/.claude/jobs", tmpfs: {mode: 0o1777, size: 16m}}             # the host's background jobs
      - {type: tmpfs, target: "${HR_HOME:?}/.claude/backups", tmpfs: {mode: 0o1777, size: 16m}}          # copies of the host ~/.claude.json
      - {type: tmpfs, target: "${HR_HOME:?}/.claude/metrics", tmpfs: {mode: 0o1777, size: 16m}}          # per-session costs, every project
      - {type: tmpfs, target: "${HR_HOME:?}/.claude/.remember", tmpfs: {mode: 0o1777, size: 16m}}        # remember notes of sessions in ~/.claude
      - {type: bind, source: "${HR_CLAUDE_MASK:?}/history.jsonl",     target: "${HR_HOME:?}/.claude/history.jsonl",     bind: {create_host_path: false}}
      - {type: bind, source: "${HR_CLAUDE_MASK:?}/bash-commands.log", target: "${HR_HOME:?}/.claude/bash-commands.log", bind: {create_host_path: false}}
      - {type: bind, source: "${HR_CLAUDE_MASK:?}/cost-tracker.log",  target: "${HR_HOME:?}/.claude/cost-tracker.log",  bind: {create_host_path: false}}
      # The security plugin's log, every project's (its agent-sdk-venv next to it stays shared).
      - {type: bind, source: "${HR_CLAUDE_MASK:?}/security/log.txt",  target: "${HR_HOME:?}/.claude/security/log.txt",  bind: {create_host_path: false}}
      - {type: volume, source: gortex,                       target: "${HR_HOME:?}/.gortex"}
      - {type: bind, source: "${HR_HOME:?}/.gortex/config.yaml",  target: "${HR_HOME:?}/.gortex/config.yaml",  read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${HR_HOME:?}/.gortex/instructions", target: "${HR_HOME:?}/.gortex/instructions", read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${HR_HOME:?}/.gortex/models",       target: "${HR_HOME:?}/.gortex/models",       read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${HR_HOME:?}/.headroom",       target: "${HR_HOME:?}/.headroom",              bind: {create_host_path: false}}
      - {type: bind, source: "${HR_HOME:?}/.serena",         target: "${HR_HOME:?}/.serena",                bind: {create_host_path: false}}
      - {type: bind, source: "${HR_HOME:?}/.cache/uv",       target: "${HR_HOME:?}/.cache/uv",              bind: {create_host_path: false}}
      - {type: volume, source: cargo,                        target: "${HR_HOME:?}/.cargo"}
      # The cargo volume is shared by every run: one run must not reconfigure the others' builds
      # or tools (review M5). Cargo reads config[.toml] and credentials[.toml] from CARGO_HOME; one
      # empty read-only host file over all four (same inode, so cargo does not warn that both
      # exist). Cargo runs `cargo-<cmd>` from CARGO_HOME/bin before PATH, whether or not it is on
      # PATH: an empty read-only tmpfs over it, so a cargo-sqlx a run planted there never runs
      # (re-review M-A). scripts/hr checks these mount points before every `up` (re-review L8b).
      # The extracted crate sources are per run (re-review residual): cargo re-extracts them from
      # the shared download cache; the package lock at the volume root stays shared.
      - {type: tmpfs,  target: "${HR_HOME:?}/.cargo/bin", read_only: true, tmpfs: {size: 1m}}   # read-only and empty: 1m is only a bound
      - {type: volume, source: cargo-src,                    target: "${HR_HOME:?}/.cargo/registry/src"}
      - {type: bind, source: "${HR_CARGO_EMPTY:?}", target: "${HR_HOME:?}/.cargo/config",           read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${HR_CARGO_EMPTY:?}", target: "${HR_HOME:?}/.cargo/config.toml",      read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${HR_CARGO_EMPTY:?}", target: "${HR_HOME:?}/.cargo/credentials",      read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${HR_CARGO_EMPTY:?}", target: "${HR_HOME:?}/.cargo/credentials.toml", read_only: true, bind: {create_host_path: false}}

volumes:
  pgdata:
  qdrant:
  gortex:
  cargo-src:       # per run, so `down -v` removes it
  cargo:
    external: true
    name: htui-hr-cargo
