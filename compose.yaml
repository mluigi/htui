# Development Postgres for htui (MOD-6), and a separate server for the test suites.
#
# `postgres` holds the `htui` database the TUI points at (`htui --set-dsn`). Postgres 18 is the one
# server htui supports (raised from ANA-9 §3's 16 on 2026-11-15), so the dev database, the suites
# and the hr sandboxes all run it. Port 5439 on the host so a locally installed Postgres on 5432 never collides. Credentials
# are development-only; the real DSN lives in the OS keyring (R-STO-1).
#
# `postgres-test` is what the suites run against: Postgres 18, data in RAM, durability off.
# `qdrant-test` is the suites' Qdrant, its storage in RAM too.
#
#   docker compose up -d
#   export HTUI_TEST_DATABASE_URL=postgres://postgres:<password from POSTGRES_PASSWORD below>@localhost:5440/postgres
#   export HTUI_TEST_QDRANT_URL=http://localhost:6336
#   cargo test -p htui-store --all-features
#
# The store tests create and drop `htui_test_*` databases through this maintenance DSN.

services:
  postgres:
    image: postgres:18
    container_name: htui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e08e7c24bdd7bb84d88c526fa11d48b6393bfb092e1368c1
      POSTGRES_DB: htui
    # Loopback only (TOOL-7 review H2): published on 0.0.0.0, the dev database was reachable from
    # every TOOL-7 sandbox through its bridge gateway, with the password in this very file.
    ports:
      - "127.0.0.1:5439:5432"
    # TOOL-5. Docker's default `/dev/shm` is 64 MiB, and Postgres puts parallel-query segments
    # there. The store suites mint a throwaway `htui_test_*` database each, so two overlapping
    # `cargo test --workspace` runs are easily 17 live databases with workers apiece — at which
    # point a backend dies with `exited with exit code 2`, the postmaster reinitializes, and every
    # in-flight case fails `57P03 the database system is in recovery mode`. That reads as an
    # assertion failure in a summary line and is not one, which is what makes it worth a line here.
    # Host memory is **not** the cause and raising it does not help: this box has 61 GiB with 47
    # available while the crashes were happening.
    #
    # AMENDED 2026-09-12 (MOD-2 milestone 9, T63): the paragraph above is wrong, or at most half
    # right. `shm_size: 1gb` is set and the crashes continued. The measured cause is the **disk**:
    # `/` hit 100% (2.7 GB free of 455 GB) with `target/debug` at 161 GB, and deleting
    # `target/debug/incremental` freed 57 GB and largely stopped them. Checked at the time:
    # /dev/shm was 8 GB with 28 KB used, and the crash reproduced with zero leaked `htui_test_*`
    # databases. Run `df -h /` before diagnosing anything else — `target/` reaches 100 GB within
    # days of normal work here. The setting below stays: it is cheap and it is correct for the
    # symptom it was written for.
    shm_size: 1gb
    # The 18 image keeps its cluster under /var/lib/postgresql/18/docker and wants the parent
    # mounted; a 16 data dir does not start on 18, hence a fresh volume rather than `htui-pgdata`.
    volumes:
      - htui-pgdata-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d htui"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-test:
    # The suites' server, kept apart from `postgres` so its settings can never cost the dev data.
    # Every store test copies a template into a new `htui_test_*` database and drops it on its last
    # line, and every DROP DATABASE waits for a checkpoint. Measured on this box
    # (2026-11-14, htui-store minus the live Qdrant cases, 542 tests): 184 s against
    # `postgres` above, 28 s on 16 with the settings below, 27 s on 18. pg_conformance's shards went
    # from 113 s to 21 s each. Durability off is only safe because nothing here outlives a test:
    # the data dir is a tmpfs, so a restart empties it and the next test rebuilds the template.
    #   fsync / full_page_writes off: checkpoints and CREATE DATABASE stop waiting on the disk.
    #   synchronous_commit off: a commit stops waiting for its WAL flush.
    #   max_connections 300: twelve test processes with a pool each, plus the template builds.
    # Settings that measured no gain on top (2026-11-14): wal_level=minimal, shared_buffers=1GB,
    # max_wal_size=8GB, checkpoint_timeout=1h, autovacuum and jit off.
    # ON DELETE RESTRICT reports SQLSTATE 23001 on 18 (23503 on 17 and older); htui-store maps the
    # whole class 23 either way.
    image: postgres:18
    container_name: htui-postgres-test
    restart: unless-stopped
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off",
              "-c", "full_page_writes=off", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e08e7c24bdd7bb84d88c526fa11d48b6393bfb092e1368c1
    ports:
      - "127.0.0.1:5440:5432"
    shm_size: 1gb
    # The 18 image keeps its cluster under /var/lib/postgresql/18/docker. A test database is about
    # 10 MB and lives seconds; 8g is a bound for a crashed run's leftovers, which the testkit's
    # sweep drops after an hour.
    tmpfs:
      - /var/lib/postgresql:size=8g
    healthcheck:
      # -h localhost: the entrypoint's init-time server is socket-only (as docker/hr/compose.hr.yaml).
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    # MOD-34 D5: pinned to the server matching `qdrant-client 1.19`, as Postgres is pinned to 18.
    image: qdrant/qdrant:v1.19.1
    container_name: htui-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6334:6334"
      - "127.0.0.1:6333:6333"
    volumes:
      - htui-qdrant-data:/qdrant/storage

  qdrant-test:
    # The suites' Qdrant (HTUI_TEST_QDRANT_URL=http://localhost:6336), kept apart from `qdrant`
    # above as `postgres-test` is from `postgres`. Every Qdrant write (a create, each payload index)
    # waits on an fsync. Measured on this box (2026-11-15) for one store open, the create plus its
    # five keyword indexes with `wait`: 2.5 s idle on the disk volume, 0.06 s on this tmpfs. Under
    # the full gate the disk's fsyncs stretched single creates past qdrant-client's 5 s deadline
    # three times running ("create collection: ... Timeout expired"). A test collection lives
    # seconds, so a restart emptying the tmpfs costs nothing.
    image: qdrant/qdrant:v1.19.1
    container_name: htui-qdrant-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:6336:6334"
      - "127.0.0.1:6335:6333"
    tmpfs:
      - /qdrant/storage:size=2g

volumes:
  htui-pgdata-18:
  htui-qdrant-data:
