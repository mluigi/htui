# Development Postgres for htui (MOD-6).
#
# Postgres 16 is the minimum server ANA-9 §3 names, so developing against it keeps every query
# inside the supported floor. Port 5439 on the host so a locally installed Postgres on 5432 never
# collides. Credentials are development-only; the real DSN lives in the OS keyring (R-STO-1).
#
#   docker compose up -d
#   export HTUI_TEST_DATABASE_URL=postgres://postgres:htui@localhost:5439/postgres
#   cargo test -p htui-store --all-features
#
# The store tests create and drop `htui_test_*` databases through this maintenance DSN; the
# `htui` database below is the one to point the TUI at (`htui --set-dsn`).

services:
  postgres:
    image: postgres:16
    container_name: htui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: htui
      POSTGRES_DB: htui
    ports:
      - "5439:5432"
    # TOOL-5. Docker's default `/dev/shm` is 64 MiB, and Postgres puts parallel-query segments
    # there. The store suites mint a throwaway `htui_test_*` database each, so two overlapping
    # `cargo test --workspace` runs are easily 17 live databases with workers apiece — at which
    # point a backend dies with `exited with exit code 2`, the postmaster reinitializes, and every
    # in-flight case fails `57P03 the database system is in recovery mode`. That reads as an
    # assertion failure in a summary line and is not one, which is what makes it worth a line here.
    # Host memory is **not** the cause and raising it does not help: this box has 61 GiB with 47
    # available while the crashes were happening.
    shm_size: 1gb
    volumes:
      - htui-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d htui"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  htui-pgdata:
